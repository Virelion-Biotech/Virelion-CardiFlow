[project]
name = "virelion-cardiflow"
version = "0.1.0"
description = "Cardiac hemodynamics, reduced-order flow, and CFD orchestration for Virelion HeartTwin"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cardiflow = "cardiflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
